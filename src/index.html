<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User registration system</title>
  </head>
  <body>
    <div class="">User registration system</div>
    <div class="">Fill out this form</div>

    <form action="/api/users/register" method="POST">
      <div class="">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Username"
          required
          value="testuser_04"
        />
</div>
<div class="">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          value="testuser_04@gmail.com"
          required
        />
</div>
<div class="">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          value="testuser_04_password"
          required
        />
</div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
